<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiKOnE - Quantum Randomness Engine</title>
    <style>
        :root {
            --primary: #FF6B6B; /* Coral Red */
            --secondary: #4ECDC4; /* Teal */
            --accent: #FFE66D; /* Yellow */
            --dark: #2F2F2F;
            --light: #F7FFF7;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; /* Prevent scroll from absolute elements */
        }

        /* Background decorative blobs */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--secondary);
            border-radius: 50%;
            top: -150px;
            left: -150px;
            opacity: 0.15;
            z-index: -1;
            filter: blur(50px);
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--primary);
            border-radius: 50%;
            bottom: -200px;
            right: -200px;
            opacity: 0.15;
            z-index: -1;
            filter: blur(50px);
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 450px;
            max-width: 90%;
            text-align: center;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--dark);
            margin-bottom: 2rem;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h2 {
            font-weight: 700;
            color: var(--dark);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #eee;
            border-radius: 16px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fdfdfd;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--secondary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden { display: none; }

        .game-area {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 1.5rem;
        }

        .card {
            background: white;
            border: 2px solid #eee;
            border-radius: 20px;
            padding: 2.5rem 1rem;
            width: 45%;
            cursor: pointer;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--dark);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Decorative stripe on cards */
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: var(--secondary);
            transition: height 0.3s;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--secondary);
            box-shadow: 0 15px 30px rgba(78, 205, 196, 0.2);
        }

        .card:hover::after {
            height: 12px;
        }

        .card:active {
            transform: scale(0.95);
        }

        .progress {
            margin-top: 1rem;
            color: #888;
            font-size: 0.9rem;
            font-weight: 600;
            background: #f0f0f0;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .results {
            margin-top: 1.5rem;
            text-align: left;
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #eee;
        }

        .results p {
            margin: 0.8rem 0;
            font-size: 1.05rem;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--secondary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Secondary button style */
        button[onclick="location.reload()"] {
            background: #95a5a6;
            box-shadow: 0 4px 15px rgba(149, 165, 166, 0.3);
            margin-top: 1rem;
        }
        button[onclick="location.reload()"]:hover {
            background: #7f8c8d;
            box-shadow: 0 8px 20px rgba(149, 165, 166, 0.4);
        }

        /* Result highlighting */
        #z-score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container" id="config-screen">
    <h1>PiKOnE Setup</h1>
    <div class="input-group">
        <label for="choice_a">Choice A Name</label>
        <input type="text" id="choice_a" placeholder="e.g. Yes">
    </div>
    <div class="input-group">
        <label for="choice_b">Choice B Name</label>
        <input type="text" id="choice_b" placeholder="e.g. No">
    </div>
    <div class="input-group">
        <label for="sessions">Number of Sessions (N)</label>
        <input type="number" id="sessions" value="10" min="1">
    </div>
    <button onclick="startSimulation()">Start Simulation</button>
</div>

<div class="container hidden" id="loading-screen">
    <h1>Harvesting Entropy...</h1>
    <p>Please wait while we fetch quantum randomness from CURBy.</p>
    <div class="loader"></div>
</div>

<div class="container hidden" id="game-screen">
    <h2 id="instruction">Pick a Number</h2>
    <div class="progress">Session <span id="current-session">1</span> / <span id="total-sessions">10</span></div>
    <div class="game-area">
        <div class="card" id="card-left" onclick="makeChoice('left')">?</div>
        <div class="card" id="card-right" onclick="makeChoice('right')">?</div>
    </div>
</div>

<div class="container hidden" id="result-screen">
    <h1>Results</h1>
    <div class="results">
        <p><strong>Z-Score:</strong> <span id="z-score"></span></p>
        <p><strong>Choice A (<span id="res-name-a"></span>):</strong> <span id="res-count-a"></span></p>
        <p><strong>Choice B (<span id="res-name-b"></span>):</strong> <span id="res-count-b"></span></p>
        <p id="analysis-msg"></p>
    </div>
    <button onclick="downloadReport()">Download PDF Report</button>
    <button onclick="location.reload()">New Simulation</button>
</div>

<script>
    let sessionData = [];
    let currentStep = 0;
    let userSelections = []; // 'left' or 'right'
    let config = {};
    let sessionId = null;

    async function startSimulation() {
        const choiceA = document.getElementById('choice_a').value || 'Choice A';
        const choiceB = document.getElementById('choice_b').value || 'Choice B';
        const sessions = parseInt(document.getElementById('sessions').value);

        if (!sessions || sessions < 1) {
            alert("Please enter a valid number of sessions.");
            return;
        }

        config = { choiceA, choiceB, sessions };

        // UI Transition
        document.getElementById('config-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');

        try {
            const response = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });

            if (!response.ok) throw new Error("Server error");

            const data = await response.json();
            sessionId = data.session_id;
            sessionData = data.steps; // Array of {left_number, right_number}

            // Start Game
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('total-sessions').innerText = sessions;

            showStep(0);

        } catch (e) {
            alert("Error starting simulation: " + e.message);
            location.reload();
        }
    }

    function showStep(idx) {
        currentStep = idx;
        document.getElementById('current-session').innerText = idx + 1;
        document.getElementById('card-left').innerText = sessionData[idx].left_number;
        document.getElementById('card-right').innerText = sessionData[idx].right_number;
    }

    function makeChoice(side) {
        userSelections.push(side);

        if (currentStep < config.sessions - 1) {
            showStep(currentStep + 1);
        } else {
            finishSimulation();
        }
    }

    async function finishSimulation() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        document.querySelector('#loading-screen h1').innerText = "Analyzing...";

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: sessionId,
                    selections: userSelections,
                    choice_a: config.choiceA,
                    choice_b: config.choiceB
                })
            });

            if (!response.ok) throw new Error("Analysis failed");

            const result = await response.json();

            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('z-score').innerText = result.z_score.toFixed(4);
            document.getElementById('res-name-a').innerText = config.choiceA;
            document.getElementById('res-name-b').innerText = config.choiceB;
            document.getElementById('res-count-a').innerText = result.count_a;
            document.getElementById('res-count-b').innerText = result.count_b;
            document.getElementById('analysis-msg').innerText = result.message;

        } catch (e) {
            alert("Error analyzing results: " + e.message);
        }
    }

    function downloadReport() {
        window.open(`/api/report/${sessionId}`, '_blank');
    }
</script>

</body>
</html>
