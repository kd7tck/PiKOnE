<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiKOnE - Quantum Randomness Engine</title>
    <style>
        :root {
            --primary: #FF6B6B; /* Coral Red */
            --secondary: #4ECDC4; /* Teal */
            --accent: #FFE66D; /* Yellow */
            --dark: #2F2F2F;
            --light: #F7FFF7;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* SVG Background */
        .background-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.7;
            animation: float 20s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 30px) rotate(10deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 480px;
            max-width: 90%;
            text-align: center;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.5);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: -webkit-linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-weight: 700;
            color: var(--dark);
            margin-top: 0;
        }

        p.subtitle {
            color: #777;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid #eee;
            border-radius: 16px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fdfdfd;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--secondary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .hidden { display: none; }

        .game-area {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 1.5rem;
        }

        .card {
            background: white;
            border: 2px solid #eee;
            border-radius: 24px;
            padding: 3rem 1rem;
            width: 45%;
            cursor: pointer;
            font-size: 3rem;
            font-weight: 900;
            color: var(--dark);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Vector pattern on cards */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: 0;
        }

        .card span {
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--secondary);
            box-shadow: 0 20px 40px rgba(78, 205, 196, 0.3);
        }

        .card:active {
            transform: scale(0.95);
        }

        .progress {
            margin-top: 1rem;
            color: #888;
            font-size: 0.9rem;
            font-weight: 600;
            background: #f0f0f0;
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
        }

        .results {
            margin-top: 1.5rem;
            text-align: left;
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #eee;
        }

        .results p {
            margin: 0.8rem 0;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
        }

        /* Quantum Loader */
        .quantum-loader {
            width: 80px;
            height: 80px;
            margin: 40px auto;
            position: relative;
        }

        .orbit {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(78, 205, 196, 0.3);
            animation: rotate 2s linear infinite;
        }

        .orbit:nth-child(2) {
            animation-delay: -0.5s;
            transform: rotate(60deg);
        }

        .orbit:nth-child(3) {
            animation-delay: -1.0s;
            transform: rotate(120deg);
        }

        .orbit::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Secondary button style */
        button.secondary-btn {
            background: white;
            color: #777;
            border: 2px solid #eee;
            box-shadow: none;
            margin-top: 0.5rem;
        }
        button.secondary-btn:hover {
            background: #f8f9fa;
            border-color: #ddd;
            transform: translateY(-2px);
            color: #555;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Result highlighting */
        .highlight-value {
            color: var(--primary);
            font-weight: 800;
        }

        .anomaly-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 1rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .anomaly-yes {
            background: #ffecec;
            color: #d63031;
            border: 1px solid #ff7675;
        }

        .anomaly-no {
            background: #e3fcf7;
            color: #00b894;
            border: 1px solid #55efc4;
        }
    </style>
</head>
<body>

<!-- SVG Background Art -->
<div class="background-art">
    <svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <!-- Floating Blobs -->
        <g class="shape" style="animation-duration: 25s; top: 10%; left: 10%;">
            <path d="M41.5,-68.6C54.3,-64.1,65.6,-56.3,74.6,-46.4C83.6,-36.5,90.3,-24.5,91.3,-12.1C92.3,0.3,87.6,13.1,81,24.8C74.4,36.5,65.9,47.1,55.3,55.4C44.7,63.7,32,69.7,19.2,72.6C6.4,75.5,-6.5,75.3,-18.8,71.7C-31.1,68.1,-42.8,61.1,-52.8,52.2C-62.8,43.3,-71.1,32.5,-75.6,20.4C-80.1,8.3,-80.8,-5.1,-76.3,-17.2C-71.8,-29.3,-62.1,-40.1,-51.1,-45.9C-40.1,-51.7,-27.8,-52.5,-16.1,-57.8C-4.4,-63.1,6.8,-72.9,19.6,-74.6C32.4,-76.3,46.8,-69.9,41.5,-68.6Z"
                  fill="#4ECDC4" opacity="0.15" transform="translate(200 200) scale(2)" />
        </g>
        <g class="shape" style="animation-duration: 30s; animation-delay: -5s; top: 60%; left: 70%;">
            <path d="M37.7,-64.4C49.6,-58.5,60.5,-50.8,69.5,-41.3C78.5,-31.8,85.6,-20.5,86.2,-8.9C86.8,2.7,80.9,14.6,73.6,25.1C66.3,35.6,57.6,44.7,48,52.1C38.4,59.5,27.9,65.2,16.8,67.6C5.7,70,-6,69.1,-17.1,65.7C-28.2,62.3,-38.7,56.4,-48.1,48.5C-57.5,40.6,-65.8,30.7,-70.5,19.3C-75.2,7.9,-76.3,-5,-72.1,-16.6C-67.9,-28.2,-58.4,-38.5,-47.9,-45.3C-37.4,-52.1,-25.9,-55.4,-14.8,-57.8C-3.7,-60.2,7.4,-61.7,18.5,-62.4C29.6,-63.1,44.2,-63,37.7,-64.4Z"
                  fill="#FF6B6B" opacity="0.15" transform="translate(800 600) scale(2.5)" />
        </g>
        <g class="shape" style="animation-duration: 35s; animation-delay: -10s; top: 80%; left: 20%;">
            <circle cx="300" cy="800" r="150" fill="#FFE66D" opacity="0.1" />
        </g>
    </svg>
</div>

<div class="container" id="config-screen">
    <h1>PiKOnE</h1>
    <p class="subtitle">Quantum Randomness Engine</p>

    <div class="input-group">
        <label for="choice_a">Choice A Name</label>
        <input type="text" id="choice_a" placeholder="e.g. Action">
    </div>
    <div class="input-group">
        <label for="choice_b">Choice B Name</label>
        <input type="text" id="choice_b" placeholder="e.g. Inaction">
    </div>
    <div class="input-group">
        <label for="sessions">Number of Sessions (N)</label>
        <input type="number" id="sessions" value="10" min="1">
    </div>
    <button onclick="startSimulation()">Initialize Engine</button>
</div>

<div class="container hidden" id="loading-screen">
    <h1>Harvesting Entropy</h1>
    <p>Interfacing with CURBy quantum beacon...</p>
    <div class="quantum-loader">
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
    </div>
</div>

<div class="container hidden" id="game-screen">
    <h2 id="instruction">Select a Quantum State</h2>
    <div class="progress">Session <span id="current-session">1</span> / <span id="total-sessions">10</span></div>
    <div class="game-area">
        <div class="card" id="card-left" onclick="makeChoice('left')">
            <!-- Subtle vector pattern -->
            <svg class="card-bg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,100 L100,0 L100,100 Z" fill="#4ECDC4" opacity="0.2"/>
            </svg>
            <span>?</span>
        </div>
        <div class="card" id="card-right" onclick="makeChoice('right')">
            <svg class="card-bg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,100 L100,0 L0,0 Z" fill="#FF6B6B" opacity="0.2"/>
            </svg>
            <span>?</span>
        </div>
    </div>
</div>

<div class="container hidden" id="result-screen">
    <h1>Analysis Complete</h1>
    <div class="results">
        <p><strong>Z-Score</strong> <span id="z-score" class="highlight-value"></span></p>
        <p><strong><span id="res-name-a"></span></strong> <span id="res-count-a"></span></p>
        <p><strong><span id="res-name-b"></span></strong> <span id="res-count-b"></span></p>
        <div id="analysis-msg" class="anomaly-badge"></div>
    </div>
    <button onclick="downloadReport()">Download Report (PDF)</button>
    <button class="secondary-btn" onclick="location.reload()">New Simulation</button>
</div>

<script>
    let sessionData = [];
    let currentStep = 0;
    let userSelections = []; // 'left' or 'right'
    let config = {};
    let sessionId = null;

    async function startSimulation() {
        const choiceA = document.getElementById('choice_a').value || 'Choice A';
        const choiceB = document.getElementById('choice_b').value || 'Choice B';
        const sessions = parseInt(document.getElementById('sessions').value);

        if (!sessions || sessions < 1) {
            alert("Please enter a valid number of sessions.");
            return;
        }

        config = { choiceA, choiceB, sessions };

        // UI Transition
        document.getElementById('config-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');

        try {
            const response = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });

            if (!response.ok) throw new Error("Server error");

            const data = await response.json();
            sessionId = data.session_id;
            sessionData = data.steps; // Array of {left_number, right_number}

            // Start Game
            // Small delay to let the animation play a bit
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('total-sessions').innerText = sessions;
                showStep(0);
            }, 1000);

        } catch (e) {
            alert("Error starting simulation: " + e.message);
            location.reload();
        }
    }

    function showStep(idx) {
        currentStep = idx;
        document.getElementById('current-session').innerText = idx + 1;
        document.getElementById('card-left').querySelector('span').innerText = sessionData[idx].left_number;
        document.getElementById('card-right').querySelector('span').innerText = sessionData[idx].right_number;
    }

    function makeChoice(side) {
        userSelections.push(side);

        if (currentStep < config.sessions - 1) {
            showStep(currentStep + 1);
        } else {
            finishSimulation();
        }
    }

    async function finishSimulation() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('loading-screen').classList.remove('hidden');
        document.querySelector('#loading-screen h1').innerText = "Processing Data";
        document.querySelector('#loading-screen p').innerText = "Analyzing statistical variance...";

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: sessionId,
                    selections: userSelections,
                    choice_a: config.choiceA,
                    choice_b: config.choiceB
                })
            });

            if (!response.ok) throw new Error("Analysis failed");

            const result = await response.json();

            // Simulate processing time
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');

                document.getElementById('z-score').innerText = result.z_score.toFixed(4);
                document.getElementById('res-name-a').innerText = config.choiceA;
                document.getElementById('res-name-b').innerText = config.choiceB;
                document.getElementById('res-count-a').innerText = result.count_a;
                document.getElementById('res-count-b').innerText = result.count_b;

                const msgEl = document.getElementById('analysis-msg');
                msgEl.innerText = result.message;

                if (result.message.includes("Significant")) {
                    msgEl.className = "anomaly-badge anomaly-yes";
                } else {
                    msgEl.className = "anomaly-badge anomaly-no";
                }
            }, 1000);

        } catch (e) {
            alert("Error analyzing results: " + e.message);
        }
    }

    function downloadReport() {
        window.open(`/api/report/${sessionId}`, '_blank');
    }
</script>

</body>
</html>
